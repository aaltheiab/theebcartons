<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carton Box Finder</title>

        @font-face {
            font-family: "CoconCustom";
            src: url("./fonts/cocon-light.woff2") format("woff2"),
                 url("./fonts/cocon-light.woff") format("woff");
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "CoconCustom";
            src: url("./fonts/cocon-bold.woff2") format("woff2"),
                 url("./fonts/cocon-bold.woff") format("woff");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --brand-dark: #5d3a1a;
            --brand-accent: #e5801a;
            --brand-bg: #f9ece4;
            --brand-ink: #3f3a43;
            --brand-card: #fffcfa;
            --brand-border: #eadfd6;
        }

        body {
            font-family: "CoconCustom", "Cocon Next Arabic", "Cocon", "Cocon LT Std", "Avenir Next Arabic", "Segoe UI", Arial, sans-serif;
            background: var(--brand-bg);
            min-height: 100vh;
            padding: 20px;
            color: var(--brand-dark);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 58px;
            height: 58px;
            object-fit: contain;
            border-radius: 10px;
            background: #fff;
            padding: 6px;
            border: 1px solid #efd7c7;
        }

        .brand-text {
            line-height: 1.2;
        }

        .brand-text strong {
            display: block;
            font-size: 1rem;
            color: var(--brand-dark);
        }

        .brand-text span {
            display: block;
            font-size: 0.86rem;
            color: var(--brand-ink);
        }

        .top-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .unit-switch {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px;
            border-radius: 999px;
            border: 1px solid #dbcbbb;
            background: #f3ebe4;
        }

        .unit-switch button {
            min-width: 56px;
            padding: 7px 14px;
            border: none;
            border-radius: 999px;
            background: transparent;
            color: var(--brand-dark);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.2px;
            transition: background-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
        }

        .unit-switch button.active {
            background: var(--brand-accent);
            color: #fff;
            box-shadow: 0 2px 8px rgba(229, 128, 26, 0.35);
        }

        .input-unit-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        h1 {
            color: var(--brand-dark);
            text-align: center;
            margin-bottom: 16px;
            font-size: 2.1rem;
        }

        .card {
            background: var(--brand-card);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 10px 24px rgba(93, 58, 26, 0.08);
            border: 1px solid var(--brand-border);
            margin-bottom: 20px;
        }

        .status {
            font-size: 0.95rem;
            color: #444;
            margin-bottom: 14px;
        }

        .status.error {
            color: #b42318;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            color: var(--brand-dark);
            font-weight: 600;
        }

        .field input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 2px solid #e6d8cc;
            font-size: 15px;
            color: var(--brand-dark);
            background: #fff;
        }

        .field input:focus {
            outline: none;
            border-color: var(--brand-accent);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        .btn-primary {
            background: var(--brand-accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: #cf7214;
            color: #fff;
        }

        .btn-secondary {
            background: #fff;
            color: var(--brand-dark);
            border: 1px solid #ddcdbf;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid #efe5dd;
            white-space: nowrap;
        }

        th {
            background: #f4ece5;
            color: var(--brand-dark);
        }

        .hint {
            margin-top: 10px;
            color: #666;
            font-size: 0.9rem;
        }

        .total-count {
            margin: 0;
            padding: 9px 12px;
            border-radius: 8px;
            background: #f4ece5;
            color: var(--brand-dark);
            font-weight: 700;
            border: 1px solid #e2d2c5;
        }

        .pagination {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .pagination button {
            background: #fff;
            color: var(--brand-dark);
            border: 1px solid #ddcdbf;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .pagination button.active {
            background: var(--brand-accent);
            color: #fff;
            border-color: var(--brand-accent);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-info {
            color: #756a60;
            font-size: 0.9rem;
            margin-inline-start: 4px;
        }

        .similarity-col {
            display: none;
        }

        .colors-cell {
            min-width: 82px;
        }

        .color-dots {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .color-dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            display: inline-block;
            border: 1px solid transparent;
        }

        .color-dot.brown {
            background: #b86a2a;
            border-color: #9f5b23;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.42) inset, 0 1px 2px rgba(0, 0, 0, 0.14);
        }

        .color-dot.white {
            background: linear-gradient(145deg, #ffffff 0%, #f0f0f0 100%);
            border: 1px solid #8e8e8e;
            box-shadow: 0 0 0 1px #ffffff inset, 0 1px 2px rgba(0, 0, 0, 0.16);
        }

        .color-dot.black {
            background: #1f1f1f;
            border-color: #050505;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14) inset;
        }

        .color-dot.blue { background: #2b78c5; border-color: #1f5f9f; }
        .color-dot.green { background: #3e8f3e; border-color: #2e6c2e; }
        .color-dot.red { background: #c64646; border-color: #9e3535; }
        .color-dot.pink { background: #d97cb0; border-color: #b75f8f; }
        .color-dot.purple { background: #8662c7; border-color: #6d4ea6; }
        .color-dot.yellow { background: #e2bb32; border-color: #be9b1f; }
        .color-dot.gray { background: #8f98a2; border-color: #747d87; }

        .id-cell {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .thick-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            background: #f4ece5;
            border: 1px solid #cda67b;
            color: #7b4b1f;
        }

        .info-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            background: #fff;
            color: var(--brand-dark);
            border: 1px solid #ccb39e;
            cursor: help;
            user-select: none;
        }

        .info-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .info-tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) translateY(2px);
            min-width: 180px;
            max-width: 280px;
            padding: 8px 10px;
            border-radius: 8px;
            background: #2f2a25;
            color: #fff;
            font-size: 0.78rem;
            line-height: 1.35;
            white-space: normal;
            text-wrap: balance;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.12s ease, transform 0.12s ease, visibility 0.12s ease;
            z-index: 20;
        }

        .info-wrap:hover .info-tooltip,
        .info-wrap:focus-within .info-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        [dir="rtl"] .info-tooltip {
            left: auto;
            right: 0;
            transform: translateY(2px);
        }

        [dir="rtl"] .info-wrap:hover .info-tooltip,
        [dir="rtl"] .info-wrap:focus-within .info-tooltip {
            transform: translateY(0);
        }

        [dir="rtl"] .field label,
        [dir="rtl"] .status,
        [dir="rtl"] .hint,
        [dir="rtl"] th,
        [dir="rtl"] td {
            text-align: right;
        }

        [dir="rtl"] .input-unit-row {
            justify-content: flex-start;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="brand">
                <img id="brandLogo" src="./img/theeb-logo.svg" alt="Theeb Cartons Logo" loading="eager" decoding="async">
                <div class="brand-text">
                    <strong id="brandTitleAr">الذييب للكرتون</strong>
                    <span id="brandTitleEn">Theeb Cartons</span>
                </div>
            </div>
            <div class="top-actions">
                <button id="langToggleBtn" class="btn-secondary" type="button">العربية</button>
            </div>
        </div>
        <h1 id="appTitle">Carton Box Finder</h1>

        <section class="card">
            <div class="input-unit-row">
                <div id="unitSwitch" class="unit-switch" role="group" aria-label="Units">
                    <button id="unitCmBtn" type="button">CM</button>
                    <button id="unitMmBtn" type="button">MM</button>
                </div>
            </div>
            <div class="grid">
                <div class="field">
                    <label id="lengthLabel" for="length">Length (mm)</label>
                    <input id="length" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 500">
                </div>
                <div class="field">
                    <label id="widthLabel" for="width">Width (mm)</label>
                    <input id="width" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 400">
                </div>
                <div class="field">
                    <label id="heightLabel" for="height">Height (mm)</label>
                    <input id="height" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 300">
                </div>
            </div>

            <div class="actions">
                <button id="searchBtn" class="btn-primary">Search Best Matches</button>
                <p id="totalBoxesCount" class="total-count">Total boxes: 0</p>
            </div>
        </section>

        <section class="card">
            <h2 id="matchesTitle">Top 10 Matches</h2>
            <div id="results">No search yet.</div>
        </section>

        <section class="card">
            <h2 id="allBoxesTitle">All Available Boxes</h2>
            <div id="allBoxes">Loading...</div>
        </section>
    </div>

        function unitLabel() {
            return currentUnit === "cm" ? t("unitCm") : t("unitMm");
        }

        function toggleUnitLabel(unit) {
            if (currentLang === "ar") return unit === "cm" ? t("unitCm") : t("unitMm");
            return unit.toUpperCase();
        }

        function dimensionLabel(key) {
            return `${t(key)} (${unitLabel()})`;
        }

        function fromMm(valueMm) {
            return currentUnit === "cm" ? valueMm / MM_PER_CM : valueMm;
        }

        function toMm(valueInCurrentUnit) {
            return currentUnit === "cm" ? valueInCurrentUnit * MM_PER_CM : valueInCurrentUnit;
        }

        function formatSize(valueMm) {
            const converted = fromMm(valueMm);
            return currentUnit === "cm"
                ? converted.toFixed(1).replace(/\.0$/, "")
                : String(Math.round(converted));
        }

        function formatPlaceholderValue(valueMm) {
            return formatSize(valueMm);
        }

        function normalizeBoxColors(rawColors) {
            const allowedColors = ["brown", "white", "black", "blue", "green", "red", "pink", "purple", "yellow", "gray"];
            if (Array.isArray(rawColors)) {
                return [...new Set(rawColors
                    .map((color) => String(color).trim().toLowerCase())
                    .filter((color) => allowedColors.includes(color)))];
            }
            if (typeof rawColors === "string") {
                return [...new Set(rawColors
                    .split(/[\s,|/]+/)
                    .map((color) => color.trim().toLowerCase())
                    .filter((color) => allowedColors.includes(color)))];
            }
            return [];
        }

        function normalizeThickness(rawThickness) {
            return String(rawThickness || "").trim().toLowerCase() === "thick";
        }

        function normalizeDescription(rawDescription) {
            const value = String(rawDescription || "").trim();
            return value;
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function colorLabel(color) {
            if (color === "brown") return t("colorBrown");
            if (color === "black") return t("colorBlack");
            if (color === "blue") return currentLang === "ar" ? "أزرق" : "Blue";
            if (color === "green") return currentLang === "ar" ? "أخضر" : "Green";
            if (color === "red") return currentLang === "ar" ? "أحمر" : "Red";
            if (color === "pink") return currentLang === "ar" ? "وردي" : "Pink";
            if (color === "purple") return currentLang === "ar" ? "بنفسجي" : "Purple";
            if (color === "yellow") return currentLang === "ar" ? "أصفر" : "Yellow";
            if (color === "gray") return currentLang === "ar" ? "رمادي" : "Gray";
            return t("colorWhite");
        }

        function calculateMatchScore(box, target) {
            const boxSorted = [box.height, box.width, box.length].sort((a, b) => a - b);
            const targetSorted = [...target].sort((a, b) => a - b);

            let sum = 0;
            for (let i = 0; i < 3; i += 1) {
                const diff = boxSorted[i] - targetSorted[i];
                sum += diff * diff;
            }
            return Math.sqrt(sum);
        }

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>${t("id")}</th>
                                <th>${dimensionLabel("thLength")}</th>
                                <th>${dimensionLabel("thWidth")}</th>
                                <th>${dimensionLabel("thHeight")}</th>
                                <th class="colors-cell">${t("thColor")}</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${pageRows.map((box) => `
                                <tr>
                                    <td>${renderIdCell(box)}</td>
                                    <td>${formatSize(box.length)}</td>
                                    <td>${formatSize(box.width)}</td>
                                    <td>${formatSize(box.height)}</td>
                                    <td class="colors-cell">${renderColorDots(box.colors)}</td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </div>
                <div class="pagination">
                    <button data-page="${allBoxesPage - 1}" ${allBoxesPage === 1 ? "disabled" : ""}>${t("prev")}</button>
                    ${pageButtons}
                    <button data-page="${allBoxesPage + 1}" ${allBoxesPage === totalPages ? "disabled" : ""}>${t("next")}</button>
                    <span class="pagination-info">${t("pageInfo").replace("{page}", allBoxesPage).replace("{total}", totalPages)}</span>
                </div>
            `;
        }

        function renderResults(matches) {
            if (matches.length === 0) {
                resultsEl.textContent = t("noMatches");
                return;
            }

            resultsEl.innerHTML = `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>${t("id")}</th>
                                <th>${dimensionLabel("thLength")}</th>
                                <th>${dimensionLabel("thWidth")}</th>
                                <th>${dimensionLabel("thHeight")}</th>
                                <th class="colors-cell">${t("thColor")}</th>
                                <th class="similarity-col">${t("matchScore")}</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${matches.map((box) => `
                                <tr>
                                    <td>${renderIdCell(box)}</td>
                                    <td>${formatSize(box.length)}</td>
                                    <td>${formatSize(box.width)}</td>
                                    <td>${formatSize(box.height)}</td>
                                    <td class="colors-cell">${renderColorDots(box.colors)}</td>
                                    <td class="similarity-col">${box.match_score.toFixed(2)}</td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </div>
                <p class="hint">${t("resultsHint")}</p>
            `;
        }

        async function loadData() {
            boxes = EMBEDDED_BOXES
                .filter((row) => Array.isArray(row) && row.length >= 4)
                .map(([id, length, width, height, colors, thickness, description]) => ({
                    id,
                    length,
                    width,
                    height,
                    colors: normalizeBoxColors(colors),
                    isThick: normalizeThickness(thickness),
                    description: normalizeDescription(description)
                }))
                .filter((box) =>
                    [box.height, box.width, box.length].every((value) => Number.isFinite(value)) &&
                    String(box.id).trim().length > 0 &&
                    box.height > 0 && box.width > 0 && box.length > 0
                )
                .sort((a, b) => String(a.id).localeCompare(String(b.id), undefined, { numeric: true, sensitivity: "base" }));
            allBoxesPage = 1;
            updateTotalBoxesCount();
            renderAllBoxes();
        }

        function search() {
            const h = Number(heightInputEl.value);
            const w = Number(widthInputEl.value);
            const l = Number(lengthInputEl.value);

            if ([h, w, l].some((value) => !Number.isFinite(value) || value <= 0)) {
                alert(t("invalidInput"));
                return;
            }

            if (boxes.length === 0) {
                alert(t("noBoxesLoaded"));
                return;
            }

            const target = [toMm(h), toMm(w), toMm(l)];
            const matches = boxes
                .map((box) => ({ ...box, match_score: calculateMatchScore(box, target) }))
                .sort((a, b) => a.match_score - b.match_score)
                .slice(0, RESULTS_LIMIT);

            lastMatches = matches;
            renderResults(matches);
        }

        async function verifyBrandFontLoaded() {
            if (!("fonts" in document)) return;
            try {
                await document.fonts.ready;
                const loaded = document.fonts.check('400 16px "CoconCustom"');
                if (!loaded) {
                    console.warn('Brand font "CoconCustom" is not loaded. Check that font files exist in ./fonts/');
                }
            } catch (error) {
                console.warn("Unable to verify custom font loading.", error);
            }
        }

        searchBtn.addEventListener("click", search);
        allBoxesEl.addEventListener("click", (event) => {
            const target = event.target;
            if (!(target instanceof HTMLElement)) return;
            const page = Number(target.getAttribute("data-page"));
            if (!Number.isFinite(page) || page < 1) return;
            allBoxesPage = page;
            renderAllBoxes();
        });
        langToggleBtn.addEventListener("click", () => {
            currentLang = currentLang === "en" ? "ar" : "en";
            applyLanguage();
        });
        unitCmBtn.addEventListener("click", () => {
            if (currentUnit === "cm") return;
            currentUnit = "cm";
            applyLanguage();
        });
        unitMmBtn.addEventListener("click", () => {
            if (currentUnit === "mm") return;
            currentUnit = "mm";
            applyLanguage();
        });
        document.addEventListener("keydown", (event) => {
            if (event.key === "Enter") search();
        });

        applyLanguage(false);
        verifyBrandFontLoaded();
        loadData();
    </script>
</body>
</html>
