<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carton Box Finder</title>
    <style>
        @font-face {
            font-family: "CoconCustom";
            src: url("./fonts/cocon-light.woff2") format("woff2"),
                 url("./fonts/cocon-light.woff") format("woff");
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "CoconCustom";
            src: url("./fonts/cocon-bold.woff2") format("woff2"),
                 url("./fonts/cocon-bold.woff") format("woff");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --brand-dark: #5d3a1a;
            --brand-accent: #e5801a;
            --brand-bg: #f9ece4;
            --brand-ink: #3f3a43;
            --brand-card: #fffcfa;
            --brand-border: #eadfd6;
        }

        body {
            font-family: "CoconCustom", "Cocon Next Arabic", "Cocon", "Cocon LT Std", "Avenir Next Arabic", "Segoe UI", Arial, sans-serif;
            background: var(--brand-bg);
            min-height: 100vh;
            padding: 20px;
            color: var(--brand-dark);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 58px;
            height: 58px;
            object-fit: contain;
            border-radius: 10px;
            background: #fff;
            padding: 6px;
            border: 1px solid #efd7c7;
        }

        .brand-text {
            line-height: 1.2;
        }

        .brand-text strong {
            display: block;
            font-size: 1rem;
            color: var(--brand-dark);
        }

        .brand-text span {
            display: block;
            font-size: 0.86rem;
            color: var(--brand-ink);
        }

        .top-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .unit-switch {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px;
            border-radius: 999px;
            border: 1px solid #dbcbbb;
            background: #f3ebe4;
        }

        .unit-switch button {
            min-width: 56px;
            padding: 7px 14px;
            border: none;
            border-radius: 999px;
            background: transparent;
            color: var(--brand-dark);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.2px;
            transition: background-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
        }

        .unit-switch button.active {
            background: var(--brand-accent);
            color: #fff;
            box-shadow: 0 2px 8px rgba(229, 128, 26, 0.35);
        }

        h1 {
            color: var(--brand-dark);
            text-align: center;
            margin-bottom: 16px;
            font-size: 2.1rem;
        }

        .card {
            background: var(--brand-card);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 10px 24px rgba(93, 58, 26, 0.08);
            border: 1px solid var(--brand-border);
            margin-bottom: 20px;
        }

        .status {
            font-size: 0.95rem;
            color: #444;
            margin-bottom: 14px;
        }

        .status.error {
            color: #b42318;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            color: var(--brand-dark);
            font-weight: 600;
        }

        .field input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 2px solid #e6d8cc;
            font-size: 15px;
            color: var(--brand-dark);
            background: #fff;
        }

        .field input:focus {
            outline: none;
            border-color: var(--brand-accent);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        .btn-primary {
            background: var(--brand-accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: #cf7214;
            color: #fff;
        }

        .btn-secondary {
            background: #fff;
            color: var(--brand-dark);
            border: 1px solid #ddcdbf;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 1px solid #efe5dd;
            white-space: nowrap;
        }

        th {
            background: #f4ece5;
            color: var(--brand-dark);
        }

        .hint {
            margin-top: 10px;
            color: #666;
            font-size: 0.9rem;
        }

        .total-count {
            margin: 0;
            padding: 9px 12px;
            border-radius: 8px;
            background: #f4ece5;
            color: var(--brand-dark);
            font-weight: 700;
            border: 1px solid #e2d2c5;
        }

        .pagination {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .pagination button {
            background: #fff;
            color: var(--brand-dark);
            border: 1px solid #ddcdbf;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 14px;
        }

        .pagination button.active {
            background: var(--brand-accent);
            color: #fff;
            border-color: var(--brand-accent);
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-info {
            color: #756a60;
            font-size: 0.9rem;
            margin-inline-start: 4px;
        }

        .similarity-col {
            display: none;
        }

        [dir="rtl"] .field label,
        [dir="rtl"] .status,
        [dir="rtl"] .hint,
        [dir="rtl"] th,
        [dir="rtl"] td {
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="brand">
                <img id="brandLogo" src="./img/theeb-logo.svg" alt="Theeb Cartons Logo" loading="eager" decoding="async">
                <div class="brand-text">
                    <strong id="brandTitleAr">الذييب للكرتون</strong>

                </div>
            </div>
            <div class="top-actions">
                <div id="unitSwitch" class="unit-switch" role="group" aria-label="Units">
                    <button id="unitCmBtn" type="button">CM</button>
                    <button id="unitMmBtn" type="button">MM</button>
                </div>
                <button id="langToggleBtn" class="btn-secondary" type="button">العربية</button>
            </div>
        </div>
        <h1 id="appTitle">Carton Box Finder</h1>

        <section class="card">
            <div class="grid">
                <div class="field">
                    <label id="lengthLabel" for="length">Length (mm)</label>
                    <input id="length" type="number" min="0.1" step="0.1" placeholder="e.g. 500">
                </div>
                <div class="field">
                    <label id="widthLabel" for="width">Width (mm)</label>

                </div>
                <div class="field">
                    <label id="heightLabel" for="height">Height (mm)</label>
                    <input id="height" type="number" min="0.1" step="0.1" placeholder="e.g. 300">
                </div>
            </div>

            <div class="actions">
                <button id="searchBtn" class="btn-primary">Search Best Matches</button>
                <p id="totalBoxesCount" class="total-count">Total boxes: 0</p>
            </div>
        </section>

        <section class="card">

        function updateTotalBoxesCount() {

        }

        function unitLabel() {
            return currentUnit === "cm" ? t("unitCm") : t("unitMm");
        }

        function toggleUnitLabel(unit) {
            if (currentLang === "ar") return unit === "cm" ? t("unitCm") : t("unitMm");
            return unit.toUpperCase();
        }

        function dimensionLabel(key) {
            return `${t(key)} (${unitLabel()})`;
        }

        function fromMm(valueMm) {
            return currentUnit === "cm" ? valueMm / MM_PER_CM : valueMm;
        }

        function toMm(valueInCurrentUnit) {
            return currentUnit === "cm" ? valueInCurrentUnit * MM_PER_CM : valueInCurrentUnit;
        }

        function formatSize(valueMm) {
            const converted = fromMm(valueMm);
            return currentUnit === "cm"
                ? converted.toFixed(1).replace(/\.0$/, "")
                : String(Math.round(converted));
        }

        function formatPlaceholderValue(valueMm) {
            return formatSize(valueMm);
        }

        function applyLanguage(rerender = true) {
            const isArabic = currentLang === "ar";
            document.documentElement.lang = currentLang;
            document.documentElement.dir = isArabic ? "rtl" : "ltr";

            unitSwitchEl.setAttribute("aria-label", t("unitSelector"));
            unitCmBtn.textContent = toggleUnitLabel("cm");
            unitMmBtn.textContent = toggleUnitLabel("mm");
            unitCmBtn.classList.toggle("active", currentUnit === "cm");
            unitMmBtn.classList.toggle("active", currentUnit === "mm");
            unitCmBtn.setAttribute("aria-pressed", currentUnit === "cm" ? "true" : "false");
            unitMmBtn.setAttribute("aria-pressed", currentUnit === "mm" ? "true" : "false");

            heightLabelEl.textContent = dimensionLabel("height");
            widthLabelEl.textContent = dimensionLabel("width");
            lengthLabelEl.textContent = dimensionLabel("length");
            heightInputEl.placeholder = t("placeholderTemplate").replace("{value}", formatPlaceholderValue(300));
            widthInputEl.placeholder = t("placeholderTemplate").replace("{value}", formatPlaceholderValue(400));
            lengthInputEl.placeholder = t("placeholderTemplate").replace("{value}", formatPlaceholderValue(500));
            searchBtn.textContent = t("searchButton");
            matchesTitleEl.textContent = t("topMatches");
            allBoxesTitleEl.textContent = t("allBoxes");
            updateTotalBoxesCount();

            if (rerender) {
                renderAllBoxes();
                if (lastMatches.length > 0) {
                    renderResults(lastMatches);
                } else {
                    resultsEl.textContent = t("noSearch");
                }
            } else {
                allBoxesEl.textContent = t("loading");
                resultsEl.textContent = t("noSearch");
            }
        }

        function calculateMatchScore(box, target) {
            const boxSorted = [box.height, box.width, box.length].sort((a, b) => a - b);
            const targetSorted = [...target].sort((a, b) => a - b);

            let sum = 0;
            for (let i = 0; i < 3; i += 1) {
                const diff = boxSorted[i] - targetSorted[i];
                sum += diff * diff;
            }
            return Math.sqrt(sum);
        }

        function renderAllBoxes() {
            if (boxes.length === 0) {
                allBoxesEl.textContent = t("noValidBoxes");
                return;
            }

            const totalPages = Math.ceil(boxes.length / ROWS_PER_PAGE);
            allBoxesPage = Math.max(1, Math.min(allBoxesPage, totalPages));
            const start = (allBoxesPage - 1) * ROWS_PER_PAGE;
            const pageRows = boxes.slice(start, start + ROWS_PER_PAGE);
            const pageButtons = Array.from({ length: totalPages }, (_, i) => i + 1)
                .map((page) => `
                    <button data-page="${page}" class="${page === allBoxesPage ? "active" : ""}">${page}</button>
                `)
                .join("");

            allBoxesEl.innerHTML = `

                    <table>
                        <thead>
                            <tr>
                                <th>${t("id")}</th>
                                <th>${dimensionLabel("thLength")}</th>
                                <th>${dimensionLabel("thWidth")}</th>
                                <th>${dimensionLabel("thHeight")}</th>
                            </tr>
                        </thead>
                        <tbody>

                                    <td>${box.id}</td>
                                    <td>${formatSize(box.length)}</td>
                                    <td>${formatSize(box.width)}</td>
                                    <td>${formatSize(box.height)}</td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </div>
                <div class="pagination">
                    <button data-page="${allBoxesPage - 1}" ${allBoxesPage === 1 ? "disabled" : ""}>${t("prev")}</button>
                    ${pageButtons}
                    <button data-page="${allBoxesPage + 1}" ${allBoxesPage === totalPages ? "disabled" : ""}>${t("next")}</button>
                    <span class="pagination-info">${t("pageInfo").replace("{page}", allBoxesPage).replace("{total}", totalPages)}</span>
                </div>
            `;
        }

        function renderResults(matches) {
            if (matches.length === 0) {
                resultsEl.textContent = t("noMatches");
                return;
            }

            resultsEl.innerHTML = `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>${t("rank")}</th>
                                <th>${t("id")}</th>
                                <th>${dimensionLabel("thLength")}</th>
                                <th>${dimensionLabel("thWidth")}</th>
                                <th>${dimensionLabel("thHeight")}</th>
                                <th class="similarity-col">${t("matchScore")}</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${matches.map((box, index) => `
                                <tr>
                                    <td>#${index + 1}</td>
                                    <td>${box.id}</td>
                                    <td>${formatSize(box.length)}</td>
                                    <td>${formatSize(box.width)}</td>
                                    <td>${formatSize(box.height)}</td>
                                    <td class="similarity-col">${box.match_score.toFixed(2)}</td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </div>
                <p class="hint">${t("resultsHint")}</p>
            `;
        }

        async function loadData() {
            boxes = EMBEDDED_BOXES
                .filter((row) => Array.isArray(row) && row.length === 4)
                .map(([id, height, width, length]) => ({ id, height, width, length }))
                .filter((box) =>
                    [box.id, box.height, box.width, box.length].every((value) => Number.isFinite(value)) &&
                    box.height > 0 && box.width > 0 && box.length > 0
                )
                .map((box, index) => ({ ...box, id: index + 1 }));
            allBoxesPage = 1;
            updateTotalBoxesCount();
            renderAllBoxes();
        }

        function search() {
            const h = Number(heightInputEl.value);
            const w = Number(widthInputEl.value);
            const l = Number(lengthInputEl.value);

            if ([h, w, l].some((value) => !Number.isFinite(value) || value <= 0)) {
                alert(t("invalidInput"));
                return;
            }

            if (boxes.length === 0) {
                alert(t("noBoxesLoaded"));
                return;
            }

            const target = [toMm(h), toMm(w), toMm(l)];
            const matches = boxes
                .map((box) => ({ ...box, match_score: calculateMatchScore(box, target) }))
                .sort((a, b) => a.match_score - b.match_score)
                .slice(0, RESULTS_LIMIT);

            lastMatches = matches;
            renderResults(matches);
        }

        async function verifyBrandFontLoaded() {
            if (!("fonts" in document)) return;
            try {
                await document.fonts.ready;
                const loaded = document.fonts.check('400 16px "CoconCustom"');
                if (!loaded) {
                    console.warn('Brand font "CoconCustom" is not loaded. Check that font files exist in ./fonts/');
                }
            } catch (error) {
                console.warn("Unable to verify custom font loading.", error);
            }
        }

        searchBtn.addEventListener("click", search);
        allBoxesEl.addEventListener("click", (event) => {
            const target = event.target;
            if (!(target instanceof HTMLElement)) return;
            const page = Number(target.getAttribute("data-page"));
            if (!Number.isFinite(page) || page < 1) return;
            allBoxesPage = page;
            renderAllBoxes();
        });
        langToggleBtn.addEventListener("click", () => {
            currentLang = currentLang === "en" ? "ar" : "en";
            applyLanguage();
        });
        unitCmBtn.addEventListener("click", () => {
            if (currentUnit === "cm") return;
            currentUnit = "cm";
            applyLanguage();
        });
        unitMmBtn.addEventListener("click", () => {
            if (currentUnit === "mm") return;
            currentUnit = "mm";
            applyLanguage();
        });
        document.addEventListener("keydown", (event) => {
            if (event.key === "Enter") search();
        });

        applyLanguage(false);
        verifyBrandFontLoaded();
        loadData();
    </script>
</body>
</html>
